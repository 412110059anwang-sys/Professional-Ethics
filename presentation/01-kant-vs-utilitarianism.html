  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-oat: #FDFBF7;
      --card-cream: #F5EFE6;
      --card-white: #FFFDF9;
      --text-coffee: #3E362E;
      --text-muted: #6E6259;
      --accent-amber: #F4A261;
      --bg-amber: #FFF3E0;
      --accent-sage: #6B9080;
      --bg-sage: #EAF4F4;
      --accent-coral: #E07A5F;
      --bg-coral: #FDE8E4;
      --border-warm: #E6CCB2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Zen Maru Gothic', 'Klee One', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-oat);
      background-image: radial-gradient(#E6CCB2 1px, transparent 1px);
      background-size: 24px 24px;
      color: var(--text-coffee);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
    }
    .top-bar {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .home-btn, .nav-unit-link {
      text-decoration: none;
      color: var(--text-coffee);
      background: var(--card-cream);
      border: 2px solid var(--border-warm);
      padding: 8px 16px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      box-shadow: 2px 3px 0px var(--border-warm);
    }
    .home-btn:hover, .nav-unit-link:hover {
      transform: translateY(-2px);
      background: var(--bg-amber);
      border-color: var(--accent-amber);
    }
    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #E6CCB2;

      transition: all 0.25s ease;
    }
    .dot.active {
      width: 28px;
      border-radius: 999px;
      background: var(--accent-amber);
    }
    .slide-card {
      width: 100%;
      max-width: 900px;
      background: var(--card-white);
      border: 3px solid var(--text-coffee);
      border-radius: 28px;
      padding: 36px 40px;
      box-shadow: 8px 10px 0px #D8C3A5;
      position: relative;
      min-height: 500px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.3s ease;
    }
    .slide-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .sticker-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-amber);
      border: 2px dashed var(--accent-amber);
      color: var(--text-coffee);
      padding: 6px 16px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.95rem;
      transform: rotate(-1deg);
    }
    .page-counter {
      font-family: 'Klee One', cursive;
      font-size: 1.05rem;
      color: var(--text-muted);
      font-weight: 600;
      background: var(--card-cream);
      padding: 4px 14px;

    }
    .slide-title {
      font-family: 'Klee One', 'Zen Maru Gothic', sans-serif;

      border-bottom: 3px dotted var(--border-warm);

    }
    .visual-content {
      font-size: 1.15rem;

      margin-bottom: 24px;

    .grid-2 {
      display: grid;

    .note-box {

    }
    .note-box.amber { background: var(--bg-amber); border-color: var(--accent-amber); }
    .note-box.coral { background: var(--bg-coral); border-color: var(--accent-coral); }
    .note-box.sage  { background: var(--bg-sage);  border-color: var(--accent-sage); }
    .note-box h4 {
      font-size: 1.2rem;
      margin-bottom: 8px;

      align-items: center;
      gap: 6px;
    }
    .note-box ul {

    .highlight {
      background: linear-gradient(transparent 55%, #FFE082 55%);

    .guiding-box {
      background: var(--bg-sage);
      border: 2.5px solid var(--accent-sage);

    }
    .guiding-label {
      font-weight: 700;
      color: #3B594C;
      font-size: 1rem;
      margin-bottom: 6px;
      display: flex;
      align-items: center;

    }
    .guiding-text {
      font-family: 'Klee One', sans-serif;
      font-size: 1.12rem;
      color: var(--text-coffee);
      line-height: 1.6;
    }
    .more-section {
      margin-bottom: 24px;
    }
    .more-btn {
      background: var(--bg-amber);
      color: var(--text-coffee);
      border: 2px solid var(--accent-amber);
      padding: 9px 20px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 2px 3px 0px #E6CCB2;
    }
    .more-btn:hover {
      background: #FFE0B2;
      transform: translateY(-1px);
    }
    .more-drawer {
      display: none;
      margin-top: 12px;
      background: #FAF6F0;
      border: 2px dashed #C8B6A6;
      border-radius: 18px;
      padding: 16px 22px;
      font-size: 1.02rem;
      line-height: 1.7;
      color: var(--text-muted);
    }
    .more-drawer.open {
      display: block;
      animation: fadeIn 0.25s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .slide-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 2px solid var(--card-cream);

    }
    .ctrl-btn {
      background: var(--text-coffee);
      color: #FFFDF9;
      border: none;
      padding: 10px 24px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 3px 4px 0px #BCA38F;
    }
    .ctrl-btn:hover:not(:disabled) {
      background: #584B3F;
      transform: translateY(-2px);
    }
    .ctrl-btn:disabled {
      background: #D6C7B8;
      cursor: not-allowed;
      box-shadow: none;
    }
    .kbd-hint {
      font-size: 0.88rem;
      color: var(--text-muted);
    }
    @media (max-width: 640px) {
      .slide-card { padding: 24px 20px; }
      .slide-title { font-size: 1.45rem; }
      .visual-content { font-size: 1.05rem; }
    }
  </style>
</head>
<body>

  <div class="top-bar">

      <a href="02-three-moral-conflicts.html" class="nav-unit-link">下一單元 ⏭️</a>

  <main class="slide-card">
    <div>
      <div class="slide-header">
        <span class="sticker-badge" id="slideTag">Unit 01 · 核心倫理觀念對決</span>
        <span class="page-counter" id="pageCounter">Slide 01 / 06</span>
      </div>

      <h1 class="slide-title" id="slideTitle">載入中...</h1>

      <div class="visual-content" id="visualContent"></div>
    </div>

    <div>
      <div class="guiding-box">
        <div class="guiding-label">💭 想一想 · 互動小提問 (Guiding Question)</div>
        <div class="guiding-text" id="guidingText"></div>
      </div>

      <div class="more-section">
        <button class="more-btn" id="moreBtn" onclick="toggleMore()">
          <span>💡 補充 / 更多..</span>
          <span id="moreArrow">▾</span>
        </button>
        <div class="more-drawer" id="moreDrawer"></div>
      </div>

      <div class="slide-footer">
        <button class="ctrl-btn" id="prevBtn" onclick="changeSlide(-1)">⬅️ 上一頁</button>
        <span class="kbd-hint">✨ 支援鍵盤 ◀ ▶ 方向鍵翻頁</span>
        <button class="ctrl-btn" id="nextBtn" onclick="changeSlide(1)">下一頁 ➡️</button>
      </div>
    </div>
  </main>

  <script>
    const slides = [{"tag": "🏷️ Unit 01 · 核心倫理觀念對決", "title": "⚖️ 動機還是結果？道德選擇的十字路口", "visual": "\n          <div class=\"note-box amber\">\n            <h4>🌟 當我們說「這個人做得對！」的時候⋯⋯</h4>\n            <p>我們真正在乎的，究竟是他背後那顆<span class=\"highlight\">「真誠守則的心（動機與義務）」</span>，還是這件事最後帶來的<span class=\"highlight\">「皆大歡喜結局（結果與福祉）」</span>？</p>\n          </div>\n          <p style=\"margin-top:14px;\">這正是專業倫理學中最經典的兩大門派對決：<strong>康德義務論 (Deontology)</strong> vs. <strong>效益主義 (Utilitarianism)</strong>！</p>\n        ", "question": "「回想你最近做過的一個重要決定，你當時最在意的是『我不能違背良心與規則』，還是『這樣做對大家結果最好』？」", "more": "<strong>道德理論 (Moral Theory)</strong> 是我們面對道德情境時所採納的價值視角，也是個人如何詮釋並實踐自身價值觀、以及專業人員在職場上決定「哪一個道德要素應該最優先考量」的準則。"}, {"tag": "🧭 哲學小羅盤 · The Right vs. The Good", "title": "🗺️ 一張圖看懂：「正當 (The Right)」與「善 (The Good)」", "visual": "\n          <div class=\"grid-2\">\n            <div class=\"note-box amber\">\n              <h4>🧭 正當 (The Right)</h4>\n              <ul>\n                <li>聚焦於做出選擇的<span class=\"highlight\">手段、原則與動機</span>。</li>\n                <li><strong>義務論 (Deontology)</strong> 的主場！</li>\n                <li>口訣：「只要出發點與原則對了，就是道德！」</li>\n              </ul>\n            </div>\n            <div class=\"note-box coral\">\n              <h4>🍎 善 (The Good)</h4>\n              <ul>\n                <li>聚焦於最終追求或促進的<span class=\"highlight\">結果與快樂福祉</span>。</li>\n                <li><strong>結果論 (Consequentialism)</strong> 的主場！</li>\n                <li>口訣：「能創造最好的結果，才算數！」</li>\n              </ul>\n            </div>\n          </div>\n        ", "question": "「如果一個人完全出自好意想幫忙朋友，結果卻不小心幫了倒忙，你覺得他在道德上算是『做對了』嗎？」", "more": "義務論者認為，只要一個人選擇與行動的理由是正當的、依循原則與義務而行，就算最後意外產生壞結果，他在道德上依然站得住腳；相反地，結果論者則以最終產出的「善（Good outcomes）」作為評判對錯的核心標準。"}, {"tag": "🛡️ Immanuel Kant · 康德義務論", "title": "🧭 康德：動機純正，且絕不把人當成「工具」！", "visual": "\n          <div class=\"note-box\">\n            <h4>🚫 康德的三大鐵律（零例外！）</h4>\n            <ul>\n              <li><strong>永遠不可說謊</strong> · <strong>永遠不可違背承諾</strong> · <strong>不讓情緒動搖義務</strong></li>\n            </ul>\n          </div>\n          <div class=\"note-box amber\" style=\"margin-top:14px;\">\n            <h4>✨ 定言令式 (Categorical Imperative) 與人性尊嚴</h4>\n            <p>「永遠將人（包含你自己）視為<span class=\"highlight\">目的本身 (Ends in themselves)</span>，而絕不僅僅視為達成目標的<span class=\"highlight\">工具 (Mere means)</span>！」</p>\n          </div>\n        ", "question": "「在日常生活或職場中，有沒有哪些時刻我們不小心把別人（或自己）當成了『單純好用的工具』，而忘了尊重對方的尊嚴與自主權？」", "more": "康德倫理學包含五大核心支柱：(1) <strong>責任歸屬 (Accountability)</strong>：人必須為自己的道德選擇負責；(2) <strong>可普遍化性 (Universalizability)</strong>：評估標準必須在所有時間與情境下對所有人一體適用；(3) <strong>純粹理性 (Reason alone)</strong>：排除主觀偏私；(4) <strong>公正性 (Impartiality)</strong>：檢視自己是否真正為了他人利益而非私利；(5) <strong>尊嚴 (Dignity)</strong>：人不是物體或工具，擁有值得深切尊重的道德地位。"}, {"tag": "📊 Utilitarianism · 效益主義", "title": "😊 效益主義：追求最大多數人的最大快樂！", "visual": "\n          <div class=\"grid-2\">\n            <div class=\"note-box amber\">\n              <h4>💉 人類福祉實例：實驗疫苗</h4>\n              <p>COVID-19 期間，受試者自願接受<span class=\"highlight\">實驗性疫苗測試</span>，協助找出最佳疫苗以防止疫情擴散、守護最大多數人的健康。</p>\n            </div>\n            <div class=\"note-box sage\">\n              <h4>🐾 動物福祉也算數！</h4>\n              <p>既然道德是「增進快樂、減少痛苦」，大多數動物（特別是<span class=\"highlight\">所有哺乳類</span>）都有感知苦樂的能力，我們有義務將牠們納入道德考量！</p>\n            </div>\n          </div>\n        ", "question": "「為什麼效益主義會特別把『動物（特別是哺乳類）的福祉』也放進道德決策的天秤裡？」", "more": "對結果論者而言，人類本能希望避免生理與心理的痛苦並追求快樂。既然正當的道德行為在於增進快樂並減少痛苦，那麼人類就不是唯一值得道德考量的生物——任何具備感受苦樂能力的生命（尤其是所有哺乳類動物），我們都有義務將其福祉納入決策中。"}, {"tag": "⚠️ 兩大理論的極限挑戰", "title": "🔥 當「目的合理化手段」遇上「道德風險」", "visual": "\n          <div class=\"grid-2\">\n            <div class=\"note-box\">\n              <h4>🧱 康德義務論的痛點</h4>\n              <p>規則完全沒有轉圜餘地！就算說一個善意的謊言能拯救無辜性命，在嚴格的康德規則下依然不被允許。</p>\n            </div>\n            <div class=\"note-box coral\">\n              <h4>💣 效益主義的兩大危機</h4>\n              <ul>\n                <li><strong>目的合理化手段</strong>：只要結果夠好，任何手段都行 ➔ 可能導致<span class=\"highlight\">犧牲無辜的少數個體</span>！</li>\n                <li><strong>道德風險 (Moral Risk)</strong>：人類無法預知未來所有後果，每個決定都充滿不確定性。</li>\n              </ul>\n            </div>\n          </div>\n        ", "question": "「如果犧牲 1 個無辜者的權益，能換取 99 個人的快樂，效益主義可能會點頭——你願意按下這個按鈕嗎？為什麼？」", "more": "效益主義非常重視個案的具體事實與變數（Context）。但正因為真實世界變數太多，人類無法完美預測一個選擇所衍生出的所有道德後果，因此所有實務決策都存在不確定性，必然伴隨不可避免的<strong>「道德風險 (Moral Risk)」</strong>。"}, {"tag": "📚 總結與延伸探索", "title": "🌱 充電完成！你是「原則派」還是「結果派」？", "visual": "\n          <div class=\"note-box amber\">\n            <h4>✨ 本單元知識小打包</h4>\n            <ul>\n              <li><strong>康德義務論</strong>替我們守住了「人性尊嚴與絕對底線（The Right）」。</li>\n              <li><strong>效益主義</strong>提醒我們看重「具體情境、群體福祉與動物保護（The Good）」。</li>\n              <li>下一單元，我們將進入職場診斷室，看看當原則衝突時會發生什麼事！</li>\n            </ul>\n          </div>\n        ", "question": "「認識了康德與效益主義之後，下次遇到兩難決定時，你會怎麼同時借用這兩位哲學家的智慧？」", "more": "<strong>延伸探索書單</strong>：<br>1. Immanuel Kant (1785), <em>Groundwork of the Metaphysics of Morals</em>（《道德形上學之基礎》）<br>2. John Stuart Mill (1863), <em>Utilitarianism</em>（《效益主義》）<br>3. Philippa Foot (1967), \"The Problem of Abortion and the Doctrine of the Double Effect\"（經典電車難題 Trolley Problem 出處）。"}];
    let currentIndex = 0;

    const dotsContainer = document.getElementById('dotsContainer');
    const slideTag = document.getElementById('slideTag');
    const pageCounter = document.getElementById('pageCounter');
    const slideTitle = document.getElementById('slideTitle');
    const visualContent = document.getElementById('visualContent');
    const guidingText = document.getElementById('guidingText');
    const moreDrawer = document.getElementById('moreDrawer');
    const moreArrow = document.getElementById('moreArrow');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    function initDots() {
      dotsContainer.innerHTML = '';
      slides.forEach((_, idx) => {
        const dot = document.createElement('div');
        dot.className = 'dot' + (idx === currentIndex ? ' active' : '');
        dot.onclick = () => goToSlide(idx);
        dotsContainer.appendChild(dot);
      });
    }

    function renderSlide() {
      const s = slides[currentIndex];
      slideTag.innerHTML = s.tag;
      pageCounter.textContent = `📌 Slide 0${currentIndex + 1} / 0${slides.length}`;
      slideTitle.innerHTML = s.title;
      visualContent.innerHTML = s.visual;
      guidingText.innerHTML = s.question;
      moreDrawer.innerHTML = s.more;
      moreDrawer.classList.remove('open');
      moreArrow.textContent = '▾';

      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === slides.length - 1;

      const dots = dotsContainer.querySelectorAll('.dot');
      dots.forEach((d, idx) => {
        d.className = 'dot' + (idx === currentIndex ? ' active' : '');
      });
    }

    function changeSlide(step) {
      const next = currentIndex + step;
      if (next >= 0 && next < slides.length) {
        currentIndex = next;
        renderSlide();
      }
    }

    function goToSlide(idx) {
      currentIndex = idx;
      renderSlide();
    }

    function toggleMore() {
      const isOpen = moreDrawer.classList.toggle('open');
      moreArrow.textContent = isOpen ? '▴' : '▾';
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') changeSlide(1);
      if (e.key === 'ArrowLeft') changeSlide(-1);
    });

    initDots();
    renderSlide();
  </script>
</body>
</html>
