  <script>
    const slides = [{"tag": "🏷️ Unit 02 · 道德衝突分類學", "title": "🩺 歡迎光臨：職場與日常的「道德衝突診斷室」", "visual": "\n          <div class=\"note-box amber\">\n            <h4>💭 為什麼心裡那麼糾結，卻說不出卡在哪裡？</h4>\n            <p>在專業倫理的<strong>七步決策模型</strong>中，第一步是<span class=\"highlight\">精確釐清事實 (Determine the Facts)</span>，第二步就是<span class=\"highlight\">診斷衝突類型</span>！</p>\n          </div>\n          <p style=\"margin-top:14px;\">因為搞清楚你遇到的是<strong>「道德兩難」</strong>、<strong>「道德無知」</strong>還是<strong>「道德困擾」</strong>，才能開出完全不同的解方處方箋！</p>\n        ", "question": "「你有沒有過那種『事情卡在那裡，心裡超級難受，卻不知道自己到底是缺知識、還是被環境逼的』的經驗？」", "more": "面對任何倫理個案，第一步永遠是準確且徹底地查明所有與道德相關的事實（Morally relevant facts），接著由個案的具體衝突性質，來決定後續決策步驟的優先順序與執行強度。"}, {"tag": "⚠️ 極端光譜警示 · Relativism vs. Absolutism", "title": "🚧 診斷前先避坑：別掉進「兩個極端陷阱」！", "visual": "\n          <div class=\"grid-2\">\n            <div class=\"note-box coral\">\n              <h4>🌀 陷阱一：個人主觀主義</h4>\n              <ul>\n                <li>「對錯全看個人喜好！（極端相對主義）」</li>\n                <li>❌ <strong>致命傷</strong>：被迫容忍一切惡劣行為、毫無評估標準、無法批評不當習俗，只剩「我討厭」而沒有道理。</li>\n              </ul>\n            </div>\n            <div class=\"note-box\">\n              <h4>🧱 陷阱二：道德絕對主義</h4>\n              <ul>\n                <li>「任何時候死背規則、無條件服從就對了！」</li>\n                <li>❌ <strong>致命傷</strong>：當兩條規則在真實世界正面對撞時，瞬間不知所措！</li>\n              </ul>\n            </div>\n          </div>\n        ", "question": "「如果有人說『每個文化或群體都有自己的規矩（文化相對主義），外人永遠沒資格批評』，這種說法會有什麼盲點？」", "more": "極端相對主義（主觀主義與文化相對主義）會帶來四大問題：(A) 我們將被迫容忍所有形式的行為，不論其動機與結果有多惡劣；(B) 無法依據任何規範性標準來評估行為；(C) 失去批評某個文化不當實踐的立場；(D) 除了「我們只是不喜歡它」之外，沒有任何批判標準。"}, {"tag": "💔 衝突類型 A · Moral Dilemma", "title": "⚡ 診斷一號：道德兩難 (Moral Dilemma) — 選哪邊都會痛！", "visual": "\n          <div class=\"note-box coral\">\n            <h4>💔 症狀定義：沒有完美無傷的選項</h4>\n            <p>在這類衝突中，<span class=\"highlight\">無論你做哪一個選擇，都會違反至少一項道德原則、都會造成某種傷害</span>，而且讓人很難保持完美無瑕的美德。</p>\n          </div>\n          <p style=\"margin-top:14px;\">📌 <strong>處方方向</strong>：進入完整的利害關係人與十大原則權衡（Step III-V），找出傷害最小、最具創意的方案，並在事後承擔起<strong>補償與修復義務</strong>！</p>\n        ", "question": "「好友告訴你一個會嚴重傷害他自己的秘密，並求你發誓絕不說出去。當『忠誠守信』與『不傷害/助人』正面相撞時，你會怎麼權衡？」", "more": "面對真正的「道德兩難（Moral Dilemma）」，現實中並不存在零成本的無痛解答。決策的重點在於透過嚴謹的原則權衡選出當下最佳的可用方案，並在做出決定後（Step VI），主動確認並承擔起隨之而來的補償或修復義務。"}, {"tag": "🌫️ 衝突類型 B · Moral Ignorance", "title": "🧭 診斷二號：道德無知 (Moral Ignorance) — 我不知道怎麼評估！", "visual": "\n          <div class=\"note-box amber\">\n            <h4>🌫️ 症狀定義：缺乏評估的地圖</h4>\n            <p>你面對一個道德衝突，但<span class=\"highlight\">不知道該從何處著手、也不知道該如何評估各個選項</span>來化解眼前的問題。</p>\n          </div>\n          <div class=\"note-box sage\" style=\"margin-top:14px;\">\n            <h4>💊 專屬處方箋：打開天線、跨界請益！</h4>\n            <ul>\n              <li>1️⃣ 主動尋求<strong>更有經驗的前輩（More experience）</strong>的智慧。</li>\n              <li>2️⃣ 向<strong>來自多元背景的人士（Varied backgrounds）</strong>廣泛徵詢建議！</li>\n            </ul>\n          </div>\n        ", "question": "「為什麼遇到『道德無知』時，特別需要找『多元背景（Varied backgrounds）』的人請益，而不是只問同溫層的好朋友？」", "more": "單一專業領域或同溫層往往容易共享相同的盲點與思維慣性。向具備豐富經驗的前輩以及多元背景的人士廣泛請益，能幫助我們看見原本忽略的利害關係人視角與潛在長遠影響。"}, {"tag": "🩹 衝突類型 C · Moral Distress", "title": "⛓️ 診斷三號：道德困擾 (Moral Distress) — 我知道對錯，卻被綁住了！", "visual": "\n          <div class=\"note-box coral\">\n            <h4>🩹 症狀定義：心裡知道正確答案，卻無能為力</h4>\n            <p>你非常清楚什麼才是最佳（或較好）的道德做法，卻因為<strong>外在結構性阻力</strong>而被迫無法付諸行動！</p>\n          </div>\n          <div class=\"grid-2\" style=\"margin-top:14px;\">\n            <div class=\"note-box\">\n              <h4>🚧 擋住你的三座大山</h4>\n              <ul>\n                <li>👑 <strong>權力結構 (Power structures)</strong>：上司施壓、職場階級</li>\n                <li>📜 <strong>法律限制 (The law)</strong>：法規僵化</li>\n                <li>💰 <strong>經濟因素 (Economics)</strong>：預算或生計壓力</li>\n              </ul>\n            </div>\n            <div class=\"note-box amber\">\n              <h4>💡 心理減壓關鍵</h4>\n              <p>這不是你「道德感不夠」，而是<span class=\"highlight\">制度與結構問題</span>！看清這點能幫你停止自我責備，轉而尋求組織與透明度突破。</p>\n            </div>\n          </div>\n        ", "question": "「在打工、實習、社團或家庭經驗中，你是否曾遇過『明明知道怎樣做對大家最好，卻因為權力結構或預算限制而無法執行』的道德困擾時刻？」", "more": "學會精準區分「道德兩難（不知道選哪個好）」與「道德困擾（清楚知道哪個好，卻因權力結構、法律或經濟因素而受阻）」，能幫助專業工作者停止不必要的自我內耗，轉而檢視組織關係結構並尋求制度面的解決之道。"}, {"tag": "📋 隨身診斷小抄", "title": "✨ 一張表帶走：職場三大道德衝突快速對照卡", "visual": "\n          <div class=\"note-box\">\n            <ul>\n              <li>⚡ <strong>道德兩難 (Moral Dilemma)</strong>：選 A 選 B 都會違背某原則並傷人 ➔ <span class=\"highlight\">權衡十大原則 + 承擔事後補償義務</span></li>\n              <li style=\"margin-top:10px;\">🌫️ <strong>道德無知 (Moral Ignorance)</strong>：不知道怎麼評估選項 ➔ <span class=\"highlight\">找資深前輩 + 跨多元背景人士請益</span></li>\n              <li style=\"margin-top:10px;\">🩹 <strong>道德困擾 (Moral Distress)</strong>：知道答案卻被權力/法律/經濟擋住 ➔ <span class=\"highlight\">檢視專業關係結構 + 陽光透明化溝通</span></li>\n            </ul>\n          </div>\n        ", "question": "「下次當朋友跟你抱怨工作或實習很痛苦時，你能試著幫他把脈，看看他是遇到了兩難、無知，還是道德困擾嗎？」", "more": "<strong>延伸探索書單</strong>：<br>1. Andrew Jameton (1984), <em>Nursing Practice: The Ethical Issues</em>（首次提出 Moral Distress 概念的經典著作）<br>2. Mary C. Gentile (2010), <em>Giving Voice to Values (GVV)</em>（探討如何在組織權力結構下為正確價值發聲）。"}];
    let currentIndex = 0;

    const dotsContainer = document.getElementById('dotsContainer');
    const slideTag = document.getElementById('slideTag');
    const pageCounter = document.getElementById('pageCounter');
    const slideTitle = document.getElementById('slideTitle');
    const visualContent = document.getElementById('visualContent');
    const guidingText = document.getElementById('guidingText');
    const moreDrawer = document.getElementById('moreDrawer');
    const moreArrow = document.getElementById('moreArrow');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    function initDots() {
      dotsContainer.innerHTML = '';
      slides.forEach((_, idx) => {
        const dot = document.createElement('div');
        dot.className = 'dot' + (idx === currentIndex ? ' active' : '');
        dot.onclick = () => goToSlide(idx);
        dotsContainer.appendChild(dot);
      });
    }

    function renderSlide() {
      const s = slides[currentIndex];
      slideTag.innerHTML = s.tag;
      pageCounter.textContent = `📌 Slide 0${currentIndex + 1} / 0${slides.length}`;
      slideTitle.innerHTML = s.title;
      visualContent.innerHTML = s.visual;
      guidingText.innerHTML = s.question;
      moreDrawer.innerHTML = s.more;
      moreDrawer.classList.remove('open');
      moreArrow.textContent = '▾';

      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === slides.length - 1;

      const dots = dotsContainer.querySelectorAll('.dot');
      dots.forEach((d, idx) => {
        d.className = 'dot' + (idx === currentIndex ? ' active' : '');
      });
    }

    function changeSlide(step) {
      const next = currentIndex + step;
      if (next >= 0 && next < slides.length) {
        currentIndex = next;
        renderSlide();
      }
    }

    function goToSlide(idx) {
      currentIndex = idx;
      renderSlide();
    }

    function toggleMore() {
      const isOpen = moreDrawer.classList.toggle('open');
      moreArrow.textContent = isOpen ? '▴' : '▾';
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') changeSlide(1);
      if (e.key === 'ArrowLeft') changeSlide(-1);
    });

    initDots();
    renderSlide();
  </script>
</body>
</html>
